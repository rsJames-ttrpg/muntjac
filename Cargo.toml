[package]
name = "muntjac"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Translate uv.lock into Buck2 build rules"
license = "MIT"
repository = "https://github.com/jackmpcollins/muntjac"
readme = "README.md"

[[bin]]
name = "muntjac"
path = "src/main.rs"

[lib]
name = "muntjac"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
filetime = "0.2"
flate2 = "1"
gix = { version = "0.83", features = ["blocking-network-client"] }
glob = "0.3"
hex = "0.4"
miette = { version = "7", features = ["fancy"] }
pathdiff = "0.2"
pep440_rs = "0.7"
pep508_rs = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"
url = { version = "2", features = ["serde"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2"
httpmock = "0.7"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
