[package]
name = "muntjac"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Translate uv.lock into Buck2 build rules"
license = "MIT"
repository = "https://github.com/jackmpcollins/muntjac"
readme = "README.md"

[[bin]]
name = "muntjac"
path = "src/main.rs"

[lib]
name = "muntjac"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
tempfile = "3"
